services:
  - type: web
    name: medilink-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash -lc "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port ${PORT}"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medilink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://medilinkhealth.netlify.app

databases:
  - name: medilink-db
    databaseName: medilink
    user: medilink
    plan: free
